name: CI

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Types & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm biome lint

      - name: Type check
        run: pnpm turbo run check-types
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"

      - name: Build all apps
        run: pnpm turbo run build
        env:
          # Placeholders — the apps only need these to be present at build time.
          VITE_API_URL: http://localhost:3005
          API_URL: http://localhost:3005
          VITE_CLOUDFLARE_TURNSTILE_SITEKEY: placeholder

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run tests
        run: |
          pnpm --filter @mcmec/auth test:run
          pnpm --filter @mcmec/supabase test:run
