name: CI

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Types & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      # manypkg: every workspace asks for the same range of a shared dependency (#279).
      - name: Check workspace dependency ranges
        run: pnpm check-pkgs

      - name: Type check
        run: pnpm check-types
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"

      - name: Build all apps
        run: pnpm build
        env:
          # Placeholders — the apps only need these to be present at build time.
          VITE_API_URL: http://localhost:3543
          API_URL: http://localhost:3543
          VITE_CLOUDFLARE_TURNSTILE_SITEKEY: placeholder

      # Reads the chunk membership central's build just wrote. Fails when App code or a table
      # other than `employees` reaches central's entry closure, or it outgrows
      # apps/central/bundle/budget.json (#241).
      - name: Check central bundle budget
        run: pnpm check-bundle

  test:
    name: Tests
    runs-on: ubuntu-latest

    # The api suite drives POST /api/commands against a real database — the invariants it
    # guards (transaction rollback across two intents, a domain precondition read back off the
    # stored row) are properties of Postgres doing the work, so there is nothing to mock.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mcmec_api_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run tests
        run: |
          pnpm --filter @mcmec/auth test:run
          pnpm --filter @mcmec/lib test:run
          pnpm --filter @mcmec/schemas test:run
          pnpm --filter api test:run
          pnpm --filter central test:run
        env:
          # Same URL the local docker one-liner produces, so a failure here reproduces locally
          # with no extra configuration. Migrations are applied by the suite's global setup.
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:54329/mcmec_api_test
